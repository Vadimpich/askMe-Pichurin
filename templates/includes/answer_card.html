{% load static %}
<div class="card mb-3">
    <div class="row g-0">
        <div class="col-2 d-flex flex-column align-items-center mt-4">
            <img src="{% static 'img/80x80.png' %}" alt="Аватарка"
                 class="rounded-circle mb-2" width="80">
            <span>ProUser</span>
        </div>
        <div class="col-10">
            <div class="card-body">
                <p class="card-text">{{ answer.text|linebreaks }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <button id="like-answer-{{ answer.id }}"
                            class="btn btn-outline-success btn-sm"
                            data-answer-id="{{ answer.id }}">
                        <i class="bi bi-heart"></i> <span
                            class="likes-count">{{ answer.likes_count }}</span>
                    </button>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               value="" id="correct_answer-{{ answer.id }}"
                               data-answer-id="{{ answer.id }}"
                               {% if answer.correct %}checked{% endif %}
                               name="correct_answer">
                        <label class="form-check-label"
                               for="correct_answer">
                            Правильный ответ
                        </label>
                    </div>
                    <span class="text-muted">1 час назад</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% if user.is_authenticated %}
<script>
    $(document).ready(function () {
        $('#like-answer-{{ answer.id }}').click(function () {
            const answerId = $(this).data('answer-id');

            $.ajax({
                url: "{% url 'like_answer' %}",
                type: 'POST',
                data: {
                    'csrfmiddlewaretoken': '{{ csrf_token }}',
                    'answer_id': answerId,
                },
                success: function (data) {
                    $(`#like-answer-${answerId} .likes-count`).text(data.likes_count);
                    $(`#like-answer-${answerId}`).toggleClass('liked');
                },
                error: function (data) {
                    alert('Ошибка: ' + data.responseJSON.error);
                }
            });
        });
        $('#correct_answer-{{ answer.id }}').click(function () {
                const answerId = $(this).data('answer-id');
                const questionId = {{ question.id }};

                $.ajax({
                    url: "{% url 'mark_correct_answer' %}",
                    type: 'POST',
                    data: {
                        'csrfmiddlewaretoken': '{{ csrf_token }}',
                        'question_id': questionId,
                        'answer_id': answerId
                    },
                    success: function (data) {
                        location.reload()
                    },
                    error: function (data) {
                        alert(data.responseJSON.error);
                        location.reload()
                    }
                });
            });
    });
</script>
{% endif %}
