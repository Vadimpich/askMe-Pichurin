{% load static %}
<header class="bg-light py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="text-decoration-none text-dark" href="{% url 'index' %}">
            <h1 class="m-0">AskMe</h1>
        </a>
        <div class="d-flex align-items-center">
            <input type="text" class="form-control me-2"
                   placeholder="Поиск...">
            <button class="btn btn-primary">Поиск</button>
        </div>
        <div class="d-flex align-items-center">
            {% if user.is_authenticated %}
                <img src="

                        {% if user.profile.avatar %}{{ user.profile.avatar.url }}{% else %}{% static 'img/40x40.png' %}{% endif %}"
                     alt="Аватарка" class="rounded-circle me-2" width="40"
                     height="40">
                <span class="me-2">{{ user.username }}</span>
                <a href="{% url 'edit_profile' %}">
                    <button class="btn btn-link">Настройки</button>
                </a>
                <form method="POST" action="{% url 'logout' %}"
                      style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}?next={{ request.path }}">
                    <button class="btn btn-primary me-2">Войти</button>
                </a>
                <a href="{% url 'signup' %}">
                    <button class="btn btn-success">Зарегистрироваться</button>
                </a>
            {% endif %}
        </div>
    </div>
</header>
